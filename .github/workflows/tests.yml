name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install test dependencies
        run: pip install -r tests/requirements.txt
      - name: Unit tests (no stack)
        run: python3 -m pytest -q -m unit tests

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit
    steps:
      - uses: actions/checkout@v7

      # The suite is black-box e2e over HTTP: it needs the full stack.
      # .env is git-ignored by design, so CI builds one from the example —
      # CI-only values, never real secrets (R8.14).
      #
      # Intelligence (Phase 3) needs a real ANTHROPIC_API_KEY/VOYAGE_API_KEY
      # to do anything useful, which CI doesn't have. Rather than fake those,
      # HOLON_EMBEDDING_PROVIDER is overridden to `local` (sentence-transformers,
      # no API key needed) so Intelligence's startup indexing succeeds, and the
      # tests that make real LLM/embedding calls are excluded below via the
      # `llm` pytest marker — they run on demand (`pytest -m llm`) against a
      # stack configured with real keys, never in CI.
      #
      # HOLON_INTELLIGENCE_RUNTIME overrides docker-compose.yml's default
      # `runsc-hostnet` (gVisor, ADR 025/R8.9) back to plain `runc` —
      # GitHub's hosted runner doesn't have gVisor installed at all, so
      # `runsc-hostnet` would be an unrecognized Docker runtime there.
      # Real dev/prod environments keep the default.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      # Helm ships a copy of docker/spicedb/schema.zed — fail fast on drift.
      - name: Check SpiceDB schema sync
        run: make check-spicedb-schema

      - name: Create .env from example
        run: |
          sed -e 's/=change-me$/=ci-only-not-a-secret/' \
              -e 's/^OPENSEARCH_ADMIN_PASSWORD=.*/OPENSEARCH_ADMIN_PASSWORD=Holon-CiOnly-Not-A-Secret-2026!/' \
              -e 's/^HOLON_JWT_SECRET=.*/HOLON_JWT_SECRET=dev-only-walking-skeleton-secret/' \
              .env.example > .env
          echo "HOLON_EMBEDDING_PROVIDER=local" >> .env
          echo "HOLON_INTELLIGENCE_RUNTIME=runc" >> .env
          echo "HOLON_LLM_PROVIDER=fake" >> .env
          # A handful of white-box test files (test_dlq.py,
          # test_bitemporal_history.py, etc.) connect to Postgres/OpenSearch
          # directly, reading these two credentials from os.environ (falling
          # back to the same dev-convenience values .env.example ships) —
          # docker-compose itself reads .env on its own for container config,
          # but a plain `pytest` step here does not, so these need exporting
          # explicitly into the job's environment for the two to agree.
          grep '^POSTGRES_PASSWORD=' .env >> "$GITHUB_ENV"
          grep '^OPENSEARCH_ADMIN_PASSWORD=' .env >> "$GITHUB_ENV"

      # experience's docker-compose bind-mount (./services/experience/app:/app/app,
      # there so Python edits hot-reload locally) overlays the image's own
      # `npm run build` output at app/static with whatever's on the *host*
      # filesystem at that path. app/static is git-ignored (it's a build
      # artifact) and this repo has never been built here before, so
      # without this step the mount presents an empty directory, GET /
      # 500s with "File at path .../index.html does not exist", and the
      # one test that loads the SPA (test_dashboard_only_talks_to_the_knowledge_api)
      # fails — confirmed as the actual, deterministic cause of the last
      # few CI failures, not flakiness.
      - name: Build the frontend
        run: |
          cd services/experience/web
          npm ci
          npm run build

      - name: Start the stack
        run: make up

      - name: Wait for the platforms
        run: |
          for i in $(seq 1 90); do
            all_ok=true
            for port in 8001 8002 8003 8004 8005 8006; do
              if ! curl -sf -m 2 "http://localhost:${port}/health" > /dev/null; then
                all_ok=false
                break
              fi
            done
            if [ "$all_ok" = "true" ]; then
              echo "All 6 platform services are healthy!"
              break
            fi
            sleep 3
          done
          for port in 8001 8002 8003 8004 8005 8006; do
            curl -sf -m 2 "http://localhost:${port}/health" > /dev/null \
              || { echo "service on port ${port} never became healthy"; docker compose logs; exit 1; }
          done

      # Principals / plugins / ObjectTypes via public APIs (CI fixtures only).
      - name: Provision test fixtures
        run: make provision-test-fixtures

      - name: Seed fake external source systems
        # Postgres source_erp, Mongo support_desk, the CSV/reviews-api/
        # Kafka-stream fixtures — none of these load on a plain `make up`
        # any more (test-only, opt-in via this target specifically).
        run: make seed

      - name: Sync test datasets
        # `make seed` never calls /sync itself, so nothing is catalogued
        # into Iceberg yet. A large slice of tests/ assume Customer/Order/
        # etc. already resolve.
        # Poll Knowledge /catalog/datasets until each sync converges
        # (async catalog consumer after connectivity.sync.completed).
        run: |
          TOKEN=$(curl -sf -X POST http://localhost:8001/token -H "Content-Type: application/json" \
            -d '{"principal_urn":"hl:acme:global:user:jdoe","client_secret":"jdoe-dev-secret"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")

          for dataset in customers orders support_tickets reviews suppliers; do
            echo "Syncing $dataset..."
            RESULT=$(curl -sf -X POST http://localhost:8002/sync -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" -d "{\"dataset\": \"$dataset\"}")
            echo "  -> $RESULT"
            DATASET_URN=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['dataset_urn'])")
            SNAPSHOT_ID=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['snapshot_id'])")

            converged=false
            for i in $(seq 1 30); do
              MATCH=$(curl -sf "http://localhost:8003/api/holon/catalog/datasets" -H "Authorization: Bearer $TOKEN" \
                | python3 -c "import sys,json; d=json.load(sys.stdin); print('yes' if any(x['urn']=='$DATASET_URN' and str(x['snapshot_id'])=='$SNAPSHOT_ID' for x in d) else 'no')")
              if [ "$MATCH" = "yes" ]; then
                echo "  -> catalogued"
                converged=true
                break
              fi
              sleep 1
            done
            if [ "$converged" != "true" ]; then
              echo "  -> $dataset never converged in Knowledge's catalog within 30s"
              exit 1
            fi
          done

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run the suite
        run: python3 -m pytest -q -m "not llm" tests

      - name: Service logs on failure
        if: failure()
        # No --tail limit: a 200-line-per-container cap was cutting logs
        # off before the actual failing request, showing only whatever
        # each container happened to log last (frequently unrelated,
        # later activity) instead of the moment that matters.
        run: docker compose logs
