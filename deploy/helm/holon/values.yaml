# Production-shaped defaults. Secrets via existingSecret / ExternalSecrets — never inline.
image:
  registry: ghcr.io
  repository: holon
  tag: latest
  pullPolicy: IfNotPresent

# Deployer-provided infrastructure (no subcharts for HA Postgres/Kafka).
external:
  postgresHost: postgres.example.svc
  postgresUser: holon
  kafkaBootstrap: redpanda.example.svc:9092
  s3Endpoint: https://s3.example
  awsRegion: us-east-1
  icebergCatalogUri: http://iceberg-rest.example.svc:8181
  icebergWarehouse: s3://holon-warehouse
  spicedbUrl: http://spicedb.example.svc:8443
  opaUrl: http://opa.example.svc:8181
  opensearchUrl: https://opensearch.example.svc:9200
  qdrantUrl: http://qdrant.example.svc:6333
  otlpEndpoint: http://otel-collector.example.svc:4318

# Optional connector backend URLs. Leave empty unless you register plugins
# that read these env vars (HOLON_SOURCE_DB_URL / HOLON_MONGO_URL / …).
connectorBackends:
  sourceDbUrl: ""
  mongoUrl: ""
  reviewsApiUrl: ""

bootstrap:
  tenantId: acme
  workspaceId: main

secretBackend: kubernetes
# Must include at least:
#   HOLON_JWT_SECRET (HS256) — or HOLON_JWT_PRIVATE_KEYS + HOLON_JWT_PUBLIC_KEYS (RS256),
#   HOLON_SPICEDB_PRESHARED_KEY, POSTGRES_PASSWORD,
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (S3/MinIO — connectivity/knowledge/intelligence),
#   HOLON_OPENSEARCH_PASSWORD (knowledge),
#   ANTHROPIC_API_KEY (intelligence)
# Conditionally, only if the matching feature is enabled:
#   HOLON_OIDC_CLIENT_SECRET (if oidc.enabled), VOYAGE_API_KEY (if HOLON_EMBEDDING_PROVIDER=voyage)
existingSecret: holon-secrets

# JWT algorithm. HS256 (default) uses HOLON_JWT_SECRET in existingSecret.
# For RS256: put HOLON_JWT_PRIVATE_KEYS + HOLON_JWT_PUBLIC_KEYS in the secret,
# set algorithm: RS256, and ideally requireAsymmetric: true.
jwt:
  algorithm: HS256
  requireAsymmetric: false

oidc:
  enabled: false
  issuer: ""
  clientId: ""
  redirectUri: ""
  scopes: "openid profile email groups"
  tenantClaim: tenant_id
  tenantGroupPrefix: "tenant:"
  workspaceGroupPrefix: "workspace:"

# Front door (optional). Prefer values-production.yaml for real hosts.
ingress:
  enabled: false
  className: ""
  host: holon.example.com
  tlsSecretName: ""
  annotations: {}

networkPolicy:
  enabled: false
  metricsNamespace: monitoring
  # CIDRs for Postgres / Kafka / S3 / SpiceDB / OpenSearch / OTLP.
  # Empty → allow public (non-RFC1918) egress so local overlays boot.
  dataPlaneCidrs: []
  intelligence:
    # Anthropic / Voyage HTTPS. Prefer concrete provider CIDRs in prod.
    allowPublicHttps: true
    llmEgressCidrs: []

# Comma-separated SPA origins. Empty → app default (localhost only).
corsOrigins: ""

# Production posture flags (override in values-production.yaml).
# holonEnv empty = not production (compose/local DX). Set to "production" in prod.
holonEnv: ""
intelligenceEnabled: true
llmProvider: anthropic
servingStoreRequireMaterialized: false

# Optional Prometheus Operator CRs. Off by default — enable when your
# cluster has ServiceMonitor / PrometheusRule CRDs. Artefacts also live
# standalone under deploy/observability/ (see docs/ops/observability.md).
observability:
  serviceMonitor:
    enabled: false
    interval: 30s
  prometheusRule:
    enabled: false

services:
  identity:
    replicas: 2
    port: 8001
  connectivity:
    # Multi-replica OK: scheduler uses Postgres advisory lock; quiesce is shared.
    replicas: 2
    port: 8002
  knowledge:
    replicas: 2
    port: 8003
  experience:
    replicas: 2
    port: 8004
  automation:
    replicas: 2
    port: 8005
  intelligence:
    replicas: 1
    port: 8006
    # Cluster must define this RuntimeClass (e.g. gVisor). Empty = node default.
    runtimeClassName: ""
