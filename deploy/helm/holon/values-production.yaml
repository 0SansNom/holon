# Production-oriented overlay — copy and fill; do not commit real secrets.
# Usage:
#   helm upgrade --install holon deploy/helm/holon -n holon --create-namespace \
#     -f deploy/helm/holon/values.yaml \
#     -f deploy/helm/holon/values-production.yaml \
#     --set image.tag=vX.Y.Z \
#     --set ingress.host=holon.example.com \
#     --set corsOrigins=https://holon.example.com
#
# Put HOLON_METRICS_TOKEN, HOLON_JWT_PRIVATE_KEYS, and HOLON_JWT_PUBLIC_KEYS
# in existingSecret (not this file).

image:
  tag: "REPLACE_WITH_RELEASE_TAG" # never deploy `latest` to prod
  pullPolicy: IfNotPresent

bootstrap:
  tenantId: acme
  workspaceId: main

# Intelligence defaults off in production. To enable beta
# (services/intelligence/BETA.md):
#   intelligenceEnabled: true
#   intelligenceBetaOptIn: true
#   services.intelligence.runtimeClassName: gvisor   # required; cluster RuntimeClass
#   toolPluginIsolation: subprocess                 # required (default)
#   llmProvider: anthropic                           # or voyage-backed stack keys in secret
#   intelligenceRpm / intelligenceDailyTokenQuota    # must stay > 0
intelligenceEnabled: false
intelligenceBetaOptIn: false
intelligenceRpm: 30
intelligenceDailyTokenQuota: 200000
toolPluginIsolation: subprocess
toolPluginTimeoutSeconds: 15
llmProvider: fake
servingStoreRequireMaterialized: true
holonEnv: production

# No connector backend env URLs unless you register matching plugins.
connectorBackends:
  sourceDbUrl: ""
  mongoUrl: ""
  reviewsApiUrl: ""
# corsOrigins: "https://holon.example.com"  # required for browser clients

oidc:
  enabled: true
  # issuer / clientId / redirectUri — set per environment

ingress:
  enabled: true
  className: ""
  host: holon.example.com
  tlsSecretName: "" # optional; set for TLS

networkPolicy:
  enabled: true
  metricsNamespace: monitoring
  # Replace with your SI CIDRs (Postgres, Kafka, S3, SpiceDB, …).
  dataPlaneCidrs: []
  intelligence:
    allowPublicHttps: true
    # Optional: pin Anthropic/Voyage egress to known CIDRs and set
    # allowPublicHttps: false.
    llmEgressCidrs: []

# RS256 is required by this overlay. Put HOLON_JWT_PRIVATE_KEYS and
# HOLON_JWT_PUBLIC_KEYS (JSON kid→PEM maps) in existingSecret. HS256 is the
# compose / values.yaml default only — do not weaken this overlay.
jwt:
  algorithm: RS256
  requireAsymmetric: true

# Prefer enabling once Prometheus Operator is installed and
# HOLON_METRICS_TOKEN is in existingSecret:
# observability:
#   serviceMonitor:
#     enabled: true
#   prometheusRule:
#     enabled: true

services:
  connectivity:
    replicas: 2
  knowledge:
    replicas: 2
  identity:
    replicas: 2
  experience:
    replicas: 2
  automation:
    replicas: 2
  intelligence:
    replicas: 2
    # Requires a cluster RuntimeClass named gvisor (or change to your name).
    runtimeClassName: gvisor
