groups:
  - name: holon.recording
    interval: 30s
    rules:
      # Success ratio (non-5xx), excluding probes.
      - record: holon:http_request_success:ratio_rate5m
        expr: |
          sum by (service) (
            rate(http_requests_total{path!~"/live|/ready|/metrics",status!~"5.."}[5m])
          )
          /
          clamp_min(
            sum by (service) (
              rate(http_requests_total{path!~"/live|/ready|/metrics"}[5m])
            ),
            1e-9
          )

      - record: holon:http_request_error:ratio_rate5m
        expr: |
          sum by (service) (
            rate(http_requests_total{path!~"/live|/ready|/metrics",status=~"5.."}[5m])
          )
          /
          clamp_min(
            sum by (service) (
              rate(http_requests_total{path!~"/live|/ready|/metrics"}[5m])
            ),
            1e-9
          )

      - record: holon:http_request_duration:p99_5m
        expr: |
          histogram_quantile(
            0.99,
            sum by (service, le) (
              rate(http_request_duration_seconds_bucket{path!~"/live|/ready|/metrics"}[5m])
            )
          )

      - record: holon:http_request_success:ratio_rate1h
        expr: |
          sum by (service) (
            rate(http_requests_total{path!~"/live|/ready|/metrics",status!~"5.."}[1h])
          )
          /
          clamp_min(
            sum by (service) (
              rate(http_requests_total{path!~"/live|/ready|/metrics"}[1h])
            ),
            1e-9
          )

      - record: holon:http_request_success:ratio_rate6h
        expr: |
          sum by (service) (
            rate(http_requests_total{path!~"/live|/ready|/metrics",status!~"5.."}[6h])
          )
          /
          clamp_min(
            sum by (service) (
              rate(http_requests_total{path!~"/live|/ready|/metrics"}[6h])
            ),
            1e-9
          )
  - name: holon.alerts
    rules:
      - alert: HolonHighErrorRate
        expr: holon:http_request_error:ratio_rate5m > 0.01
        for: 5m
        labels:
          severity: warning
          platform: holon
        annotations:
          summary: "Holon {{ $labels.service }} 5xx ratio > 1%"
          description: >-
            Service {{ $labels.service }} error ratio is {{ $value | humanizePercentage }}
            over 5m (probes excluded). Check /ready, recent deploys, and dependency health.

      - alert: HolonHighLatencyP99
        expr: holon:http_request_duration:p99_5m > 2
        for: 5m
        labels:
          severity: warning
          platform: holon
        annotations:
          summary: "Holon {{ $labels.service }} p99 latency > 2s"
          description: >-
            Service {{ $labels.service }} p99 is {{ $value | humanizeDuration }} over 5m
            (probes excluded). Check DB/SpiceDB/Kafka and hot routes.

      # Fast burn vs 99.9% SLO (error budget ≈ 0.1%). Multi-window: 14.4× burn
      # over 1h and 6× over 6h ≈ classic "page on fast burn".
      - alert: HolonErrorBudgetBurn
        expr: |
          (
            (1 - holon:http_request_success:ratio_rate1h) > (14.4 * 0.001)
          )
          and
          (
            (1 - holon:http_request_success:ratio_rate6h) > (6 * 0.001)
          )
        for: 2m
        labels:
          severity: critical
          platform: holon
        annotations:
          summary: "Holon {{ $labels.service }} burning availability error budget"
          description: >-
            {{ $labels.service }} is burning the 99.9% availability budget quickly.
            See docs/ops/observability.md.

      - alert: HolonMetricsScrapeAbsent
        expr: up{job="holon"} == 0 or absent(up{job="holon"})
        for: 10m
        labels:
          severity: critical
          platform: holon
        annotations:
          summary: "Holon metrics scrape missing or down"
          description: >-
            Prometheus cannot scrape Holon /metrics (job=holon). Check NetworkPolicy,
            HOLON_METRICS_TOKEN, and Service endpoints.
