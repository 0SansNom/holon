{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: holon
  labels:
    app.kubernetes.io/name: holon
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  {{- if .Values.ingress.tlsSecretName }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tlsSecretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /oidc
            pathType: Prefix
            backend:
              service:
                name: holon-identity
                port:
                  number: {{ .Values.services.identity.port }}
          - path: /token
            pathType: Prefix
            backend:
              service:
                name: holon-identity
                port:
                  number: {{ .Values.services.identity.port }}
          - path: /login
            pathType: Prefix
            backend:
              service:
                name: holon-identity
                port:
                  number: {{ .Values.services.identity.port }}
          - path: /logout
            pathType: Prefix
            backend:
              service:
                name: holon-identity
                port:
                  number: {{ .Values.services.identity.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: holon-experience
                port:
                  number: {{ .Values.services.experience.port }}
{{- end }}
