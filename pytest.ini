[pytest]
markers =
    llm: makes real, metered calls to an external LLM/embedding provider (Anthropic/Voyage). Excluded from CI by default (cost + secret-exposure risk on public CI runners) — run explicitly with `pytest -m llm` against a stack configured with real API keys.
# The marker above documented this exclusion but never enforced it — a
# plain `pytest tests`/`make test` ran the metered LLM tests anyway.
# `-m "not llm"` is the default deselect; `pytest -m llm tests` (or any
# explicit `-m` on the command line overrides addopts) still runs them
# against a stack with real API keys.
addopts = -m "not llm"
