[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
markers =
    unit: no live Holon stack (pure libs / white-box)
    integration: needs compose HTTP stack (or local infra)
    llm: real LLM/embedding spend — optional nightly/local only (not on PR CI)
    soak: concurrent / burst Intelligence suite — nightly only
filterwarnings =
    ignore::DeprecationWarning
