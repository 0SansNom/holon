name: holon

x-app-env: &app-env
  HOLON_TENANT_ID: acme
  HOLON_WORKSPACE_ID: main
  HOLON_ENV: ${HOLON_ENV:-}
  HOLON_JWT_SECRET: ${HOLON_JWT_SECRET}
  HOLON_JWT_SECRETS: ${HOLON_JWT_SECRETS:-}
  HOLON_JWT_ACTIVE_KID: ${HOLON_JWT_ACTIVE_KID:-}
  HOLON_JWT_ALG: ${HOLON_JWT_ALG:-}
  HOLON_JWT_PRIVATE_KEYS: ${HOLON_JWT_PRIVATE_KEYS:-}
  HOLON_JWT_PRIVATE_KEY: ${HOLON_JWT_PRIVATE_KEY:-}
  HOLON_JWT_PUBLIC_KEYS: ${HOLON_JWT_PUBLIC_KEYS:-}
  HOLON_JWT_PUBLIC_KEY: ${HOLON_JWT_PUBLIC_KEY:-}
  HOLON_JWT_REQUIRE_ASYMMETRIC: ${HOLON_JWT_REQUIRE_ASYMMETRIC:-}
  HOLON_SECRET_BACKEND: ${HOLON_SECRET_BACKEND:-env}
  HOLON_KAFKA_BOOTSTRAP: redpanda:9092
  HOLON_SPICEDB_URL: http://spicedb:8443
  HOLON_SPICEDB_PRESHARED_KEY: ${HOLON_SPICEDB_PRESHARED_KEY}
  HOLON_SPICEDB_SCHEMA_PATH: /app/spicedb-schema.zed
  HOLON_OPA_URL: http://opa:8181
  # Leave unset (or empty) to disable tracing. Do NOT default to
  # 127.0.0.1 inside containers — that address is the container itself,
  # so every service would spam connection-refused forever.
  HOLON_OTLP_ENDPOINT: ${HOLON_OTLP_ENDPOINT:-}
  HOLON_INTELLIGENCE_ENABLED: ${HOLON_INTELLIGENCE_ENABLED:-true}
  HOLON_LLM_PROVIDER: ${HOLON_LLM_PROVIDER:-anthropic}
  HOLON_METRICS_TOKEN: ${HOLON_METRICS_TOKEN:-}
  HOLON_CORS_ORIGINS: ${HOLON_CORS_ORIGINS:-http://localhost:5173,http://localhost:8004}
  # OIDC (identity reads these; empty issuer keeps local secret login only).
  HOLON_OIDC_ISSUER: ${HOLON_OIDC_ISSUER:-}
  HOLON_OIDC_CLIENT_ID: ${HOLON_OIDC_CLIENT_ID:-}
  HOLON_OIDC_CLIENT_SECRET: ${HOLON_OIDC_CLIENT_SECRET:-}
  HOLON_OIDC_REDIRECT_URI: ${HOLON_OIDC_REDIRECT_URI:-http://localhost:8001/oidc/callback}
  HOLON_OIDC_SCOPES: ${HOLON_OIDC_SCOPES:-openid profile email groups}
  HOLON_OIDC_TENANT_CLAIM: ${HOLON_OIDC_TENANT_CLAIM:-tenant_id}
  HOLON_OIDC_TENANT_GROUP_PREFIX: ${HOLON_OIDC_TENANT_GROUP_PREFIX:-tenant:}
  HOLON_OIDC_WORKSPACE_GROUP_PREFIX: ${HOLON_OIDC_WORKSPACE_GROUP_PREFIX:-workspace:}
  HOLON_OIDC_POST_LOGIN_REDIRECT: ${HOLON_OIDC_POST_LOGIN_REDIRECT:-http://localhost:5173/objects}
  # SAML (identity reads these; empty IdP metadata keeps SAML disabled).
  HOLON_SAML_IDP_METADATA_URL: ${HOLON_SAML_IDP_METADATA_URL:-}
  HOLON_SAML_IDP_METADATA_XML: ${HOLON_SAML_IDP_METADATA_XML:-}
  HOLON_SAML_SP_ENTITY_ID: ${HOLON_SAML_SP_ENTITY_ID:-http://localhost:8001/saml/metadata}
  HOLON_SAML_SP_ACS_URL: ${HOLON_SAML_SP_ACS_URL:-http://localhost:8001/saml/acs}
  HOLON_SAML_SP_CERT: ${HOLON_SAML_SP_CERT:-}
  HOLON_SAML_SP_PRIVATE_KEY: ${HOLON_SAML_SP_PRIVATE_KEY:-}
  HOLON_SAML_POST_LOGIN_REDIRECT: ${HOLON_SAML_POST_LOGIN_REDIRECT:-http://localhost:5173/objects}
  # SCIM (identity reads this; empty token keeps the SCIM router disabled).
  HOLON_SCIM_BEARER_TOKEN: ${HOLON_SCIM_BEARER_TOKEN:-}
  HOLON_PLUGIN_ENTRY_PREFIXES: ${HOLON_PLUGIN_ENTRY_PREFIXES:-app.plugins.,app.tool_plugins.,holon_test_plugins.}
  # Local compose Postgres/source-s3/reviews-api/oauth2-idp are RFC1918; production leaves this unset (fail closed).
  HOLON_CONNECTOR_ALLOWED_HOSTS: ${HOLON_CONNECTOR_ALLOWED_HOSTS:-postgres,source-s3,reviews-api,oauth2-idp}
  HOLON_IDENTITY_URL: http://identity:8000

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: holon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./tests/fixtures/postgres-init:/docker-entrypoint-initdb.d:ro
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      # -d postgres explicit: pg_isready defaults the target database to
      # the connecting user ("holon"), which doesn't exist — harmless to
      # the readiness check itself (still resolves to accepting/rejecting)
      # but spams the log with "FATAL: database holon does not exist"
      # every interval, forever.
      test: [ "CMD-SHELL", "pg_isready -U holon -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 15

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      # Default root user for local S3 storage
      MINIO_ROOT_USER: holon
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # Infra only: creates the warehouse bucket, no fixture files copied in.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c " until mc alias set local http://minio:9000 holon ${MINIO_ROOT_PASSWORD}; do echo waiting for minio; sleep 2; done && mc mb -p local/holon-warehouse || true && echo bucket ready "

  # Test-only fixture file for the CSV connector — not started by default.
  # `make seed` (or `docker compose --profile test-fixtures run --rm
  # csv-seed`) copies it in when actually needed.
  csv-seed:
    profiles: [ "test-fixtures" ]
    image: minio/mc:latest
    depends_on:
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./tests/fixtures/csv-seed:/seed:ro
    entrypoint: >
      /bin/sh -c " mc alias set local http://minio:9000 holon ${MINIO_ROOT_PASSWORD} && mc cp /seed/suppliers.csv local/holon-warehouse/landing/suppliers.csv && echo csv seeded "

  # External S3 store fixture for testing object storage connector
  source-s3:
    profiles: [ "test-fixtures" ]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: source
      MINIO_ROOT_PASSWORD: source12345
    ports:
      - "9500:9000"
    volumes:
      - source-s3-data:/data

  # Seed utility for object storage connector
  source-s3-seed:
    profiles: [ "test-fixtures" ]
    image: minio/mc:latest
    depends_on:
      - source-s3
    volumes:
      - ./tests/fixtures/csv-seed:/seed:ro
    entrypoint: >
      /bin/sh -c " until mc alias set src http://source-s3:9000 source source12345; do echo waiting for source-s3; sleep 2; done && mc mb -p src/tenant-landing || true && mc cp /seed/suppliers.csv src/tenant-landing/landing/suppliers.csv && echo source-s3 seeded "

  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    depends_on:
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      CATALOG_WAREHOUSE: s3://holon-warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: holon
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: us-east-1
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:postgresql://postgres:5432/holon_iceberg_catalog
      CATALOG_JDBC_USER: holon
      CATALOG_JDBC_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8181:8181"

  # One-shot migration initializer for SpiceDB
  spicedb-migrate:
    image: authzed/spicedb:latest
    command:
      - datastore
      - migrate
      - head
      - --datastore-engine=postgres
      - --datastore-conn-uri=postgres://holon:${POSTGRES_PASSWORD}@postgres:5432/holon_spicedb?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  spicedb:
    image: authzed/spicedb:latest
    command:
      - serve
      - --grpc-preshared-key=${HOLON_SPICEDB_PRESHARED_KEY}
      - --http-enabled
      - --datastore-engine=postgres
      - --datastore-conn-uri=postgres://holon:${POSTGRES_PASSWORD}@postgres:5432/holon_spicedb?sslmode=disable
    ports:
      - "50051:50051"
      - "8443:8443"
    depends_on:
      spicedb-migrate:
        condition: service_completed_successfully

  opa:
    image: openpolicyagent/opa:latest
    command:
      - run
      - --server
      - --addr=:8181
      - /policies/holon.rego
    volumes:
      - ./tests/fixtures/opa/holon.rego:/policies/holon.rego:ro
    ports:
      - "8281:8181"

  mongodb:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  # Test-only REST API fixture
  reviews-api:
    profiles: [ "test-fixtures" ]
    image: python:3.12-slim
    working_dir: /data
    volumes:
      - ./tests/fixtures/reviews-api:/data:ro
    command: [ "python", "-m", "http.server", "8000" ]
    ports:
      - "8091:8000"

  # Fake external OAuth2 client_credentials IdP, for the REST connector's
  # OAuth2 auth type — deliberately not Holon's own Identity service (see
  # tests/fixtures/oauth2-idp/server.py's docstring: connector_safety
  # blocks every platform-internal hostname by design).
  oauth2-idp:
    profiles: [ "test-fixtures" ]
    image: python:3.12-slim
    working_dir: /data
    volumes:
      - ./tests/fixtures/oauth2-idp:/data:ro
    command: [ "python", "server.py" ]

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      # Redpanda listeners (internal compose network and host access)
      - --kafka-addr=INTERNAL://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr=INTERNAL://redpanda:9092,OUTSIDE://localhost:19092
    ports:
      - "9092:9092"
      - "19092:19092"
    healthcheck:
      test: [ "CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'" ]
      interval: 5s
      timeout: 5s
      retries: 30

  inventory-stream-seed:
    profiles: [ "test-fixtures" ]
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda:
        condition: service_healthy
    volumes:
      - ./tests/fixtures/stream-seed:/seed:ro
    entrypoint: >
      /bin/sh -c " rpk topic create external-inventory-stream --brokers redpanda:9092 -p 1 -r 1 || true && cat /seed/inventory_events.jsonl | rpk topic produce external-inventory-stream --brokers redpanda:9092 --compression none && echo stream seeded "

  opensearch:
    image: opensearchproject/opensearch:2.17.0
    restart: unless-stopped
    environment:
      # Compose-only: single-node + security plugin off. Prod = HA +
      # security plugin (or equivalent) — docs/ops/deploy.md, SECURITY.md.
      - discovery.type=single-node
      - plugins.security.disabled=true
      - bootstrap.memory_lock=false
      - OPENSEARCH_JAVA_OPTS=-Xms256m -Xmx512m
      # 2.12+'s security plugin demands this even with the plugin disabled
      # flag above (its own bootstrap check runs first) — a fixed dev-only
      # value, same treatment as SpiceDB's preshared key elsewhere in this
      # compose file. Production chart enables OpenSearch security.
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD}
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -su admin:${OPENSEARCH_ADMIN_PASSWORD} http://localhost:9200/_cluster/health | grep -q '\"status\":\"'" ]
      interval: 5s
      timeout: 5s
      retries: 30

  # Semantic retrieval's vector store (metadata
  # only, never bulk instance vectorization). No auth needed for a
  # single-node dev deployment, same posture as this build's other
  # dev-only infra.
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage


  identity:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    restart: unless-stopped
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]
    environment:
      <<: *app-env
      HOLON_DB_URL: postgresql://holon:${POSTGRES_PASSWORD}@postgres:5432/holon_identity
      HOLON_ALLOW_USER_JWT_MINT: "true"
      HOLON_MINTABLE_PRINCIPAL_URNS: ""
      HOLON_BOOTSTRAP_ADMIN_SECRET: ${HOLON_BOOTSTRAP_ADMIN_SECRET:-}
      HOLON_BOOTSTRAP_ADMIN_RESET_SECRET: ${HOLON_BOOTSTRAP_ADMIN_RESET_SECRET:-}
    volumes:
      - ./libs:/app/libs
      - ./services/identity/app:/app/app
      - ./deploy/helm/holon/files/spicedb-schema.zed:/app/spicedb-schema.zed:ro
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      spicedb:
        condition: service_started
      opa:
        condition: service_started
      redpanda:
        condition: service_healthy

  connectivity:
    build:
      context: .
      dockerfile: services/connectivity/Dockerfile
    restart: unless-stopped

    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]
    environment:
      <<: *app-env
      PYTHONPATH: /app:/app/libs:/opt/holon-test-plugins
      HOLON_DB_URL: postgresql://holon:${POSTGRES_PASSWORD}@postgres:5432/holon_connectivity
      HOLON_MINTABLE_PRINCIPAL_URNS: connectivity-pipeline-runner
      HOLON_SOURCE_DB_URL: postgresql://holon:${POSTGRES_PASSWORD}@postgres:5432/source_erp
      HOLON_MONGO_URL: mongodb://mongodb:27017
      HOLON_REVIEWS_API_URL: http://reviews-api:8000/reviews.json
      HOLON_EXCHANGE_RATE_FEED_URL: http://reviews-api:8000/exchange_rates.json
      HOLON_KNOWLEDGE_URL: http://knowledge:8000
      HOLON_ICEBERG_CATALOG_URI: http://iceberg-rest:8181
      HOLON_ICEBERG_WAREHOUSE: s3://holon-warehouse/
      AWS_ACCESS_KEY_ID: holon
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: us-east-1
      HOLON_S3_ENDPOINT: http://minio:9000
    volumes:
      - ./libs:/app/libs
      - ./services/connectivity/app:/app/app
      # Test-only fixture plugins (tests/fixtures/plugins) — imported only
      # when a test registers one via POST /plugins; never auto-registered.
      - ./tests/fixtures/plugins:/opt/holon-test-plugins:ro
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
      iceberg-rest:
        condition: service_started
      redpanda:
        condition: service_healthy
      spicedb:
        condition: service_started
      opa:
        condition: service_started
      identity:
        condition: service_started

  knowledge:
    build:
      context: .
      dockerfile: services/knowledge/Dockerfile
    restart: unless-stopped

    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]
    environment:
      <<: *app-env
      PYTHONPATH: /app:/app/libs:/opt/holon-test-plugins
      HOLON_DB_URL: postgresql://holon:${POSTGRES_PASSWORD}@postgres:5432/holon_knowledge
      HOLON_MINTABLE_PRINCIPAL_URNS: knowledge-project-validator,knowledge-model-caller
      HOLON_SERVING_STORE_REQUIRE_MATERIALIZED: ${HOLON_SERVING_STORE_REQUIRE_MATERIALIZED:-}
      HOLON_IDENTITY_URL: http://identity:8000
      HOLON_INTELLIGENCE_URL: http://intelligence:8000
      HOLON_OPENSEARCH_URL: http://opensearch:9200
      HOLON_OPENSEARCH_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD}
      HOLON_ICEBERG_CATALOG_URI: http://iceberg-rest:8181
      HOLON_ICEBERG_WAREHOUSE: s3://holon-warehouse/
      AWS_ACCESS_KEY_ID: holon
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: us-east-1
      HOLON_S3_ENDPOINT: http://minio:9000
    volumes:
      - ./libs:/app/libs
      - ./services/knowledge/app:/app/app
      - ./deploy/helm/holon/files/spicedb-schema.zed:/app/spicedb-schema.zed:ro
      # Test-only fixture plugins (tests/fixtures/plugins) — imported only
      # when a test registers one via POST /plugins; never auto-registered.
      - ./tests/fixtures/plugins:/opt/holon-test-plugins:ro
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
      iceberg-rest:
        condition: service_started
      redpanda:
        condition: service_healthy
      spicedb:
        condition: service_started
      opa:
        condition: service_started
      opensearch:
        condition: service_healthy
      identity:
        condition: service_started

  automation:
    build:
      context: .
      dockerfile: services/automation/Dockerfile
    restart: unless-stopped

    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]
    environment:
      <<: *app-env
      HOLON_DB_URL: postgresql://holon:${POSTGRES_PASSWORD}@postgres:5432/holon_automation
      HOLON_MINTABLE_PRINCIPAL_URNS: automation-workflow-engine,ingest-bot
      HOLON_CONNECTIVITY_URL: http://connectivity:8000
      HOLON_KNOWLEDGE_URL: http://knowledge:8000
      HOLON_INTELLIGENCE_URL: http://intelligence:8000
    volumes:
      - ./libs:/app/libs
      - ./services/automation/app:/app/app
    ports:
      - "8005:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      spicedb:
        condition: service_started
      opa:
        condition: service_started
      knowledge:
        condition: service_started
      intelligence:
        condition: service_started
      identity:
        condition: service_started

  intelligence:
    build:
      context: .
      dockerfile: services/intelligence/Dockerfile
    restart: unless-stopped

    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]
    environment:
      <<: *app-env
      PYTHONPATH: /app:/app/libs:/opt/holon-test-plugins
      HOLON_TOOL_PLUGIN_ENTRY_PREFIXES: ${HOLON_TOOL_PLUGIN_ENTRY_PREFIXES:-app.tool_plugins.,holon_test_plugins.}
      HOLON_DB_URL: postgresql://holon:${POSTGRES_PASSWORD}@postgres:5432/holon_intelligence
      HOLON_MINTABLE_PRINCIPAL_URNS: intelligence-indexer,ingest-bot
      HOLON_KNOWLEDGE_URL: http://knowledge:8000
      HOLON_QDRANT_URL: http://qdrant:6333
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      HOLON_LLM_MODEL: claude-sonnet-5
      HOLON_EMBEDDING_PROVIDER: ${HOLON_EMBEDDING_PROVIDER:-voyage}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      HOLON_WEATHER_FEED_URL: http://reviews-api:8000/weather.json
      HOLON_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: holon
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: us-east-1

    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Sandboxed container runtime for agent tool execution
    runtime: ${HOLON_INTELLIGENCE_RUNTIME:-runc}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /root/.cache
    volumes:
      - ./libs:/app/libs
      - ./services/intelligence/app:/app/app
      # Test-only fixture plugins (tests/fixtures/plugins) — imported only
      # when a test registers one via POST /plugins; never auto-registered.
      - ./tests/fixtures/plugins:/opt/holon-test-plugins:ro
    ports:
      - "8006:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      qdrant:
        condition: service_started
      spicedb:
        condition: service_started
      opa:
        condition: service_started
      knowledge:
        condition: service_started
      identity:
        condition: service_started

  experience:
    build:
      context: .
      dockerfile: services/experience/Dockerfile
    restart: unless-stopped

    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]
    environment:
      <<: *app-env
      PYTHONPATH: /app:/app/libs:/opt/holon-test-plugins
      HOLON_DB_URL: postgresql://holon:${POSTGRES_PASSWORD}@postgres:5432/holon_experience
      HOLON_MINTABLE_PRINCIPAL_URNS: ingest-bot
      HOLON_KNOWLEDGE_URL: http://knowledge:8000
      HOLON_IDENTITY_URL: http://identity:8000
      HOLON_CONNECTIVITY_URL: http://connectivity:8000
      HOLON_INTELLIGENCE_URL: http://intelligence:8000
    volumes:
      - ./libs:/app/libs
      - ./services/experience/app:/app/app
      - ./deploy/helm/holon/files/spicedb-schema.zed:/app/spicedb-schema.zed:ro
      # Test-only fixture plugins (tests/fixtures/plugins) — imported only
      # when a test registers one via POST /plugins; never auto-registered.
      - ./tests/fixtures/plugins:/opt/holon-test-plugins:ro
    ports:
      - "8004:8000"
    depends_on:
      postgres:
        condition: service_healthy
      knowledge:
        condition: service_started
      connectivity:
        condition: service_started
      spicedb:
        condition: service_started
      opa:
        condition: service_started
      identity:
        condition: service_started

volumes:
  pg-data:
  minio-data:
  source-s3-data:
  mongo-data:
  opensearch-data:
  qdrant-data:
